name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

# Both jobs are checkout + setup-python + local scripts; neither touches the
# token or writes to the repo (same shape as signoff.yml, which runs under
# `contents: read`). Explicit is required: an absent permissions block is a
# CodeQL finding.
permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Driver transient grading regressions
        run: python3 -m unittest discover -s sim/driver-tran
      - name: Install simulators
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator
          iverilog -V | head -1
          verilator --version
      - name: Install cocotb
        run: pip install -r verification/serializer/requirements.txt
      - name: Lint RTL
        run: verification/lint_rtl.sh
      - name: Serializer bench (good leg + negative control)
        run: python3 verification/serializer/runner.py

  reuse-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -I scripts/check_reuse_lock.py
