name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install simulators
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator
          iverilog -V | head -1
          verilator --version
      - name: Install cocotb
        run: pip install -r verification/smoke/requirements.txt
      - name: Lint RTL
        run: verification/lint_rtl.sh
      - name: Smoke bench (good leg + negative control)
        run: python3 verification/smoke/runner.py
      - name: Serializer bench (good leg + negative control)
        run: python3 verification/serializer/runner.py
